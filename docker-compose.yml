services:

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  worker:
    build: ./worker
    depends_on:
      - redis
      - mongo

  redis:
    image: redis

  mongo:
    image: mongo
    ports:
      - "27017:27017"